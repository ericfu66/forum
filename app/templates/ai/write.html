{% extends "base.html" %}

{% block title %}AI写稿 - {{ site_name }}{% endblock %}

{% block content %}
<div class="container" style="padding-top: 40px; padding-bottom: 40px;">
    <div class="row">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">✍️ AI写稿</h2>
                    <p class="text-muted">输入主题，让AI帮你生成文章内容</p>
                </div>

                <div class="card-body">
                    <!-- 预设模板 -->
                    <div class="form-group">
                        <label class="form-label">快捷预设</label>
                        <div class="preset-grid">
                            <button type="button" class="preset-btn" onclick="applyPreset(event, 'advice')">
                                <span class="preset-icon">💬</span>
                                <span class="preset-name">劝告信</span>
                            </button>
                            <button type="button" class="preset-btn" onclick="applyPreset(event, 'lost')">
                                <span class="preset-icon">🔍</span>
                                <span class="preset-name">寻物启事</span>
                            </button>
                            <button type="button" class="preset-btn" onclick="applyPreset(event, 'notice')">
                                <span class="preset-icon">📢</span>
                                <span class="preset-name">通知公告</span>
                            </button>
                            <button type="button" class="preset-btn" onclick="applyPreset(event, 'review')">
                                <span class="preset-icon">📝</span>
                                <span class="preset-name">活动总结</span>
                            </button>
                            <button type="button" class="preset-btn" onclick="applyPreset(event, 'invitation')">
                                <span class="preset-icon">💌</span>
                                <span class="preset-name">邀请函</span>
                            </button>
                            <button type="button" class="preset-btn" onclick="applyPreset(event, 'apology')">
                                <span class="preset-icon">🙏</span>
                                <span class="preset-name">道歉信</span>
                            </button>
                            <button type="button" class="preset-btn" onclick="applyPreset(event, 'thanks')">
                                <span class="preset-icon">❤️</span>
                                <span class="preset-name">感谢信</span>
                            </button>
                            <button type="button" class="preset-btn" onclick="applyPreset(event, 'proposal')">
                                <span class="preset-icon">💡</span>
                                <span class="preset-name">建议书</span>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">文章主题 <span style="color: var(--danger-color);">*</span></label>
                        <input type="text" id="topic" class="form-control" placeholder="例如：人工智能的未来发展趋势">
                    </div>

                    <div class="form-group">
                        <label class="form-label">关键词（可选，用逗号分隔）</label>
                        <input type="text" id="keywords" class="form-control" placeholder="例如：AI, 机器学习, 深度学习">
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <!-- 写作风格 -->
                        <div class="form-group">
                            <label class="form-label">写作风格</label>
                            <select id="style" class="form-control" onchange="toggleCustomStyle()">
                                <option value="">默认</option>
                                <option value="formal">正式严谨</option>
                                <option value="casual">轻松随意</option>
                                <option value="humorous">幽默风趣</option>
                                <option value="academic">学术严谨</option>
                                <option value="news">新闻报道</option>
                                <option value="custom">自定义...</option>
                            </select>
                            <input type="text" id="custom-style" class="form-control" 
                                   style="display: none; margin-top: 8px;" 
                                   placeholder="描述你想要的写作风格">
                        </div>

                        <!-- 写作语气 -->
                        <div class="form-group">
                            <label class="form-label">写作语气</label>
                            <select id="tone" class="form-control" onchange="toggleCustomTone()">
                                <option value="">默认</option>
                                <option value="professional">专业权威</option>
                                <option value="friendly">友好亲切</option>
                                <option value="serious">严肃认真</option>
                                <option value="enthusiastic">热情洋溢</option>
                                <option value="objective">客观中立</option>
                                <option value="custom">自定义...</option>
                            </select>
                            <input type="text" id="custom-tone" class="form-control" 
                                   style="display: none; margin-top: 8px;" 
                                   placeholder="描述你想要的写作语气">
                        </div>
                    </div>

                    <!-- 字数控制 -->
                    <div class="form-group">
                        <label class="form-label">
                            目标字数
                            <span id="word-count-display" style="color: var(--primary-color); font-weight: 500; margin-left: 8px;">800字</span>
                        </label>
                        <div style="display: flex; align-items: center; gap: 16px;">
                            <input type="range" id="word-count-slider" class="form-range" 
                                   min="100" max="5000" step="100" value="800"
                                   oninput="syncWordCount(this.value)"
                                   style="flex: 1;">
                            <input type="number" id="word-count-input" class="form-control" 
                                   min="100" max="5000" step="50" value="800"
                                   oninput="syncWordCountFromInput(this.value)"
                                   style="width: 100px;">
                        </div>
                        <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">
                            <span>100字</span>
                            <span>5000字</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox" id="stream-mode" checked style="width: 16px; height: 16px;">
                            <span>流式输出</span>
                            <span class="text-muted" style="font-size: 12px;">（实时显示生成内容）</span>
                        </label>
                    </div>

                    <button id="generate-btn" class="btn btn-primary" onclick="generateArticle()">
                        <span>🤖</span>
                        <span>生成文章</span>
                    </button>
                </div>

                <div id="result-area" style="display: none;">
                    <div class="card-header">
                        <h3 class="card-title">生成结果</h3>
                        <span id="actual-word-count" style="color: var(--text-muted); font-size: 0.9rem;"></span>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label class="form-label">文章标题</label>
                            <input type="text" id="article-title" class="form-control" placeholder="为文章起个标题">
                        </div>
                        <div class="form-group">
                            <label class="form-label">文章内容</label>
                            <textarea id="article-content" class="form-control" rows="15" oninput="updateActualWordCount()"></textarea>
                        </div>
                        
                        <!-- AI修改区域 -->
                        <div class="form-group">
                            <label class="form-label">AI修改</label>
                            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                                <input type="text" id="revision-request" class="form-control" 
                                       placeholder="输入修改要求，例如：让语气更正式、增加具体例子、缩短到500字...">
                                <button class="btn btn-secondary" onclick="reviseArticle()" id="revise-btn">
                                    ✏️ 修改
                                </button>
                            </div>
                            <div style="font-size: 0.85rem; color: var(--text-muted);">
                                💡 提示：可以要求AI调整风格、增删内容、改变结构等
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">保存到版块</label>
                            <select id="save-board" class="form-control">
                                <option value="">选择版块...</option>
                                {% for board in boards %}
                                <option value="{{ board.id }}">{{ board.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div style="display: flex; gap: 12px;">
                            <button class="btn btn-secondary" onclick="copyArticle()">📋 复制</button>
                            <button class="btn btn-primary" onclick="saveAsPost()">💾 保存为帖子</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="loading-overlay" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center;">
    <div class="card" style="text-align: center; padding: 40px;">
        <div class="loading-spinner"></div>
        <p style="margin-top: 16px;">AI正在创作中...</p>
    </div>
</div>

<style>
.form-range {
    -webkit-appearance: none;
    appearance: none;
    height: 8px;
    background: var(--bg-tertiary);
    border-radius: 4px;
    outline: none;
}

.form-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    background: var(--primary-color);
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.2s;
}

.form-range::-webkit-slider-thumb:hover {
    transform: scale(1.1);
}

.form-range::-moz-range-thumb {
    width: 20px;
    height: 20px;
    background: var(--primary-color);
    border-radius: 50%;
    cursor: pointer;
    border: none;
}

/* 预设按钮样式 */
.preset-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 10px;
    margin-bottom: 8px;
}

.preset-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 8px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all 0.2s ease;
}

.preset-btn:hover {
    background: var(--primary-light);
    border-color: var(--primary-color);
    transform: translateY(-2px);
}

.preset-btn.active {
    background: var(--primary-color);
    color: white;
    border-color: var(--primary-color);
}

.preset-icon {
    font-size: 1.5rem;
}

.preset-name {
    font-size: 0.8rem;
    font-weight: 500;
}
</style>
{% endblock %}

{% block extra_js %}
<script>
// 预设模板配置
const PRESETS = {
    advice: {
        topic: '劝告信',
        keywords: '劝告,建议,关心',
        style: 'formal',
        tone: 'friendly',
        wordCount: 500,
        placeholder: '例如：劝告同学不要沉迷游戏'
    },
    lost: {
        topic: '寻物启事',
        keywords: '寻物,丢失,联系方式',
        style: 'formal',
        tone: 'serious',
        wordCount: 300,
        placeholder: '例如：丢失了一把黑色雨伞'
    },
    notice: {
        topic: '通知公告',
        keywords: '通知,公告,重要',
        style: 'formal',
        tone: 'professional',
        wordCount: 400,
        placeholder: '例如：关于期末考试安排的通知'
    },
    review: {
        topic: '活动总结',
        keywords: '活动,总结,收获',
        style: 'formal',
        tone: 'enthusiastic',
        wordCount: 800,
        placeholder: '例如：校园运动会活动总结'
    },
    invitation: {
        topic: '邀请函',
        keywords: '邀请,活动,欢迎',
        style: 'formal',
        tone: 'friendly',
        wordCount: 400,
        placeholder: '例如：邀请参加班级联欢会'
    },
    apology: {
        topic: '道歉信',
        keywords: '道歉,抱歉,改正',
        style: 'formal',
        tone: 'serious',
        wordCount: 400,
        placeholder: '例如：为迟到向老师道歉'
    },
    thanks: {
        topic: '感谢信',
        keywords: '感谢,感激,帮助',
        style: 'formal',
        tone: 'friendly',
        wordCount: 500,
        placeholder: '例如：感谢老师的辛勤教导'
    },
    proposal: {
        topic: '建议书',
        keywords: '建议,改进,方案',
        style: 'formal',
        tone: 'professional',
        wordCount: 600,
        placeholder: '例如：关于改善食堂伙食的建议'
    }
};

let currentPreset = null;

// 应用预设 - 修复bug：正确接收event参数
function applyPreset(event, presetKey) {
    const preset = PRESETS[presetKey];
    if (!preset) return;
    
    // 更新UI状态
    document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
    event.currentTarget.classList.add('active');
    
    currentPreset = presetKey;
    
    // 应用预设值
    document.getElementById('topic').placeholder = preset.placeholder;
    document.getElementById('keywords').value = preset.keywords;
    document.getElementById('style').value = preset.style;
    document.getElementById('tone').value = preset.tone;
    syncWordCount(preset.wordCount);
    document.getElementById('word-count-input').value = preset.wordCount;
    document.getElementById('word-count-slider').value = preset.wordCount;
    
    // 隐藏自定义输入
    document.getElementById('custom-style').style.display = 'none';
    document.getElementById('custom-tone').style.display = 'none';
    
    Utils.showToast(`已应用"${preset.topic}"预设`, 'success');
}

// 同步字数滑块和输入框
function syncWordCount(value) {
    value = Math.max(100, Math.min(5000, parseInt(value) || 800));
    document.getElementById('word-count-input').value = value;
    document.getElementById('word-count-display').textContent = value + '字';
}

function syncWordCountFromInput(value) {
    value = Math.max(100, Math.min(5000, parseInt(value) || 800));
    document.getElementById('word-count-slider').value = value;
    document.getElementById('word-count-display').textContent = value + '字';
}

// 切换自定义风格输入
function toggleCustomStyle() {
    const select = document.getElementById('style');
    const customInput = document.getElementById('custom-style');
    customInput.style.display = select.value === 'custom' ? 'block' : 'none';
    if (select.value !== 'custom') {
        customInput.value = '';
    }
}

// 切换自定义语气输入
function toggleCustomTone() {
    const select = document.getElementById('tone');
    const customInput = document.getElementById('custom-tone');
    customInput.style.display = select.value === 'custom' ? 'block' : 'none';
    if (select.value !== 'custom') {
        customInput.value = '';
    }
}

// 获取实际的风格值
function getStyleValue() {
    const select = document.getElementById('style');
    if (select.value === 'custom') {
        return document.getElementById('custom-style').value.trim();
    }
    return select.value;
}

// 获取实际的语气值
function getToneValue() {
    const select = document.getElementById('tone');
    if (select.value === 'custom') {
        return document.getElementById('custom-tone').value.trim();
    }
    return select.value;
}

// 更新实际字数显示
function updateActualWordCount() {
    const content = document.getElementById('article-content').value;
    const count = content.length;
    document.getElementById('actual-word-count').textContent = `实际字数: ${count}字`;
}

async function generateArticle() {
    const topic = document.getElementById('topic').value.trim();
    const keywords = document.getElementById('keywords').value.split(',').map(k => k.trim()).filter(k => k);
    const wordCount = parseInt(document.getElementById('word-count-input').value) || 800;
    const style = getStyleValue();
    const tone = getToneValue();
    const streamMode = document.getElementById('stream-mode').checked;

    if (!topic) {
        Utils.showToast('请输入文章主题', 'warning');
        return;
    }

    if (wordCount < 100 || wordCount > 5000) {
        Utils.showToast('字数必须在100-5000之间', 'warning');
        return;
    }

    if (streamMode) {
        await generateArticleStream(topic, keywords, wordCount, style, tone);
    } else {
        await generateArticleNormal(topic, keywords, wordCount, style, tone);
    }
}

async function generateArticleNormal(topic, keywords, wordCount, style, tone) {
    document.getElementById('loading-overlay').style.display = 'flex';

    try {
        const response = await Utils.post('/ai/api/write/generate', {
            topic,
            keywords,
            word_count: wordCount,
            style,
            tone
        });

        if (response.success) {
            document.getElementById('article-content').value = response.content;
            document.getElementById('article-title').value = topic;
            document.getElementById('result-area').style.display = 'block';
            updateActualWordCount();
            Utils.showToast('文章生成成功！', 'success');
        } else {
            Utils.showToast(response.message || '生成失败', 'danger');
        }
    } catch (e) {
        Utils.showToast('生成失败：' + e.message, 'danger');
    } finally {
        document.getElementById('loading-overlay').style.display = 'none';
    }
}

async function generateArticleStream(topic, keywords, wordCount, style, tone) {
    document.getElementById('article-content').value = '';
    document.getElementById('article-title').value = topic;
    document.getElementById('result-area').style.display = 'block';
    document.getElementById('actual-word-count').textContent = '实际字数: 0字';

    const generateBtn = document.getElementById('generate-btn');
    generateBtn.disabled = true;
    generateBtn.innerHTML = '<span class="loading-spinner loading-spinner-sm"></span> 生成中...';

    try {
        const response = await fetch('/ai/api/write/generate/stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                topic, 
                keywords, 
                word_count: wordCount,
                style,
                tone
            })
        });

        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.message || '请求失败');
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        const contentArea = document.getElementById('article-content');
        let content = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value);
            const lines = chunk.split('\n');

            for (const line of lines) {
                if (line.startsWith('data: ')) {
                    let data = line.substring(6);

                    if (data === '[DONE]') {
                        break;
                    }

                    data = data.replace(/\\n/g, '\n');
                    content += data;
                    contentArea.value = content;
                    contentArea.scrollTop = contentArea.scrollHeight;
                    updateActualWordCount();
                }
            }
        }

        Utils.showToast('文章生成成功！', 'success');
    } catch (e) {
        Utils.showToast('生成失败：' + e.message, 'danger');
    } finally {
        generateBtn.disabled = false;
        generateBtn.innerHTML = '<span>🤖</span><span>生成文章</span>';
    }
}

function copyArticle() {
    const content = document.getElementById('article-content').value;
    navigator.clipboard.writeText(content).then(() => {
        Utils.showToast('已复制到剪贴板', 'success');
    });
}

async function reviseArticle() {
    const originalContent = document.getElementById('article-content').value.trim();
    const revisionRequest = document.getElementById('revision-request').value.trim();
    const wordCount = parseInt(document.getElementById('word-count-input').value) || 800;
    const style = getStyleValue();
    const tone = getToneValue();

    if (!originalContent) {
        Utils.showToast('请先生成文章内容', 'warning');
        return;
    }

    if (!revisionRequest) {
        Utils.showToast('请输入修改要求', 'warning');
        return;
    }

    const reviseBtn = document.getElementById('revise-btn');
    const originalBtnText = reviseBtn.innerHTML;
    reviseBtn.disabled = true;
    reviseBtn.innerHTML = '<span class="loading-spinner loading-spinner-sm"></span> 修改中...';

    // 清空内容区域，准备接收新内容
    document.getElementById('article-content').value = '';
    document.getElementById('actual-word-count').textContent = '实际字数: 0字';

    try {
        const response = await fetch('/ai/api/write/revise', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                original_content: originalContent,
                revision_request: revisionRequest,
                word_count: wordCount,
                style: style,
                tone: tone
            })
        });

        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.message || '请求失败');
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        const contentArea = document.getElementById('article-content');
        let content = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value);
            const lines = chunk.split('\n');

            for (const line of lines) {
                if (line.startsWith('data: ')) {
                    let data = line.substring(6);

                    if (data === '[DONE]') {
                        break;
                    }

                    data = data.replace(/\\n/g, '\n');
                    content += data;
                    contentArea.value = content;
                    contentArea.scrollTop = contentArea.scrollHeight;
                    updateActualWordCount();
                }
            }
        }

        // 清空修改要求输入框
        document.getElementById('revision-request').value = '';
        Utils.showToast('文章修改成功！', 'success');
    } catch (e) {
        Utils.showToast('修改失败：' + e.message, 'danger');
        // 恢复原内容
        document.getElementById('article-content').value = originalContent;
        updateActualWordCount();
    } finally {
        reviseBtn.disabled = false;
        reviseBtn.innerHTML = originalBtnText;
    }
}

async function saveAsPost() {
    const title = document.getElementById('article-title').value.trim();
    const content = document.getElementById('article-content').value.trim();
    const boardId = document.getElementById('save-board').value;

    if (!title || !content || !boardId) {
        Utils.showToast('请填写标题、内容并选择版块', 'warning');
        return;
    }

    const response = await Utils.post('/ai/api/write/save', {
        title,
        content,
        board_id: boardId
    });

    if (response.success) {
        Utils.showToast('保存成功！', 'success');
        setTimeout(() => {
            window.location.href = '/post/' + response.post_id;
        }, 1000);
    } else {
        Utils.showToast(response.message || '保存失败', 'danger');
    }
}
</script>
{% endblock %}
