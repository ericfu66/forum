{% extends "base.html" %}

{% block title %}发帖 - {{ site_name }}{% endblock %}

{% block extra_css %}
<style>
/* Markdown工具栏样式 */
.md-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 8px;
    background: var(--bg-tertiary);
    border: 2px solid var(--border-color);
    border-bottom: none;
    border-radius: var(--radius-md) var(--radius-md) 0 0;
}

.md-toolbar-btn {
    padding: 6px 10px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 14px;
    color: var(--text-secondary);
    transition: all var(--transition-fast);
    display: flex;
    align-items: center;
    gap: 4px;
}

.md-toolbar-btn:hover {
    background: var(--primary-light);
    color: var(--primary-color);
    border-color: var(--primary-color);
}

.md-toolbar-btn:active {
    transform: scale(0.95);
}

.md-toolbar-divider {
    width: 1px;
    height: 28px;
    background: var(--border-color);
    margin: 0 4px;
}

.md-editor {
    border-radius: 0 0 var(--radius-md) var(--radius-md);
    border-top: none;
    font-family: 'Consolas', 'Monaco', monospace;
    line-height: 1.6;
}

/* 预览区域 */
.md-preview {
    display: none;
    padding: var(--spacing-md);
    background: var(--bg-secondary);
    border: 2px solid var(--border-color);
    border-top: none;
    border-radius: 0 0 var(--radius-md) var(--radius-md);
    min-height: 200px;
    max-height: 400px;
    overflow-y: auto;
}

.md-preview.active {
    display: block;
}

.md-editor-container.preview-mode .md-editor {
    display: none;
}

.md-editor-container.preview-mode .md-preview {
    display: block;
}

/* 媒体上传区域 */
.media-upload-section {
    margin-top: var(--spacing-md);
    padding: var(--spacing-md);
    background: var(--bg-tertiary);
    border-radius: var(--radius-md);
    border: 2px dashed var(--border-color);
}

.media-upload-section h4 {
    margin: 0 0 var(--spacing-sm) 0;
    font-size: 14px;
    color: var(--text-secondary);
}

.upload-area {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
}

.upload-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all var(--transition-fast);
}

.upload-btn:hover {
    background: var(--primary-light);
    border-color: var(--primary-color);
}

.upload-btn input[type="file"] {
    display: none;
}

/* 图片预览 */
.image-preview-container {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: var(--spacing-sm);
}

.image-preview-item {
    position: relative;
    width: 100px;
    height: 100px;
    border-radius: var(--radius-sm);
    overflow: hidden;
    border: 2px solid var(--border-color);
}

.image-preview-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.image-preview-item .remove-btn {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 24px;
    height: 24px;
    background: rgba(244, 67, 54, 0.9);
    color: white;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* 语音预览 */
.audio-preview {
    margin-top: var(--spacing-sm);
    padding: 10px;
    background: var(--bg-secondary);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    gap: 10px;
}

.audio-preview audio {
    flex: 1;
    height: 40px;
}

.audio-preview .remove-btn {
    padding: 6px 12px;
    background: #F44336;
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
}

/* 录音按钮 */
.record-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all var(--transition-fast);
}

.record-btn.recording {
    background: #F44336;
    color: white;
    border-color: #F44336;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
}

/* 手机端适配 */
@media (max-width: 768px) {
    .md-toolbar {
        gap: 2px;
        padding: 6px;
    }

    .md-toolbar-btn {
        padding: 5px 8px;
        font-size: 12px;
    }

    .md-toolbar-btn span:last-child {
        display: none;
    }
}
</style>
{% endblock %}

{% block content %}
<div class="container" style="padding-top: 40px; padding-bottom: 40px;">
    <div class="row">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">📝 发布新帖</h2>
                </div>

                <form method="POST" action="{{ url_for('post.create') }}" enctype="multipart/form-data">
                    <div class="form-group">
                        <label class="form-label">版块</label>
                        <select name="board_id" class="form-control" required>
                            <option value="">选择版块...</option>
                            {% for board in boards %}
                            <option value="{{ board.id }}">{{ board.icon }} {{ board.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">标题</label>
                        <input type="text" name="title" class="form-control" placeholder="请输入帖子标题" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">内容（支持Markdown）</label>
                        <div class="md-editor-container">
                            <!-- Markdown工具栏 -->
                            <div class="md-toolbar">
                                <button type="button" class="md-toolbar-btn" onclick="mdInsert('bold')" title="粗体 (Ctrl+B)">
                                    <span>𝐁</span><span>粗体</span>
                                </button>
                                <button type="button" class="md-toolbar-btn" onclick="mdInsert('italic')" title="斜体 (Ctrl+I)">
                                    <span>𝐼</span><span>斜体</span>
                                </button>
                                <button type="button" class="md-toolbar-btn" onclick="mdInsert('strikethrough')" title="删除线">
                                    <span>S̶</span><span>删除线</span>
                                </button>
                                <div class="md-toolbar-divider"></div>
                                <button type="button" class="md-toolbar-btn" onclick="mdInsert('h2')" title="标题2">
                                    <span>H2</span>
                                </button>
                                <button type="button" class="md-toolbar-btn" onclick="mdInsert('h3')" title="标题3">
                                    <span>H3</span>
                                </button>
                                <div class="md-toolbar-divider"></div>
                                <button type="button" class="md-toolbar-btn" onclick="mdInsert('quote')" title="引用">
                                    <span>❝</span><span>引用</span>
                                </button>
                                <button type="button" class="md-toolbar-btn" onclick="mdInsert('code')" title="代码">
                                    <span>&lt;/&gt;</span><span>代码</span>
                                </button>
                                <button type="button" class="md-toolbar-btn" onclick="mdInsert('codeblock')" title="代码块">
                                    <span>📋</span><span>代码块</span>
                                </button>
                                <div class="md-toolbar-divider"></div>
                                <button type="button" class="md-toolbar-btn" onclick="mdInsert('ul')" title="无序列表">
                                    <span>•</span><span>列表</span>
                                </button>
                                <button type="button" class="md-toolbar-btn" onclick="mdInsert('ol')" title="有序列表">
                                    <span>1.</span><span>编号</span>
                                </button>
                                <button type="button" class="md-toolbar-btn" onclick="mdInsert('task')" title="任务列表">
                                    <span>☑</span><span>任务</span>
                                </button>
                                <div class="md-toolbar-divider"></div>
                                <button type="button" class="md-toolbar-btn" onclick="mdInsert('link')" title="链接">
                                    <span>🔗</span><span>链接</span>
                                </button>
                                <button type="button" class="md-toolbar-btn" onclick="mdInsert('image')" title="图片">
                                    <span>🖼</span><span>图片</span>
                                </button>
                                <button type="button" class="md-toolbar-btn" onclick="mdInsert('hr')" title="分隔线">
                                    <span>—</span><span>分隔</span>
                                </button>
                                <div class="md-toolbar-divider"></div>
                                <button type="button" class="md-toolbar-btn" onclick="togglePreview()" title="预览">
                                    <span>👁</span><span>预览</span>
                                </button>
                            </div>
                            <textarea id="content-editor" name="content" class="form-control md-editor" rows="12" placeholder="请输入帖子内容...支持Markdown语法" required></textarea>
                            <div id="content-preview" class="md-preview post-content"></div>
                        </div>
                    </div>

                    <!-- 图片上传 -->
                    <div class="form-group">
                        <div class="media-upload-section">
                            <h4>🖼️ 上传图片（可选，最多9张）</h4>
                            <div class="upload-area">
                                <label class="upload-btn">
                                    <span>📷</span>
                                    <span>选择图片</span>
                                    <input type="file" name="images" id="image-input" multiple accept="image/*">
                                </label>
                                <small style="color: var(--text-muted);">支持 PNG、JPG、GIF、WebP 格式</small>
                            </div>
                            <div class="image-preview-container" id="image-preview"></div>
                        </div>
                    </div>

                    <!-- 语音上传 -->
                    <div class="form-group">
                        <div class="media-upload-section">
                            <h4>🎤 上传语音（可选）</h4>
                            <div class="upload-area" style="flex-direction: row; flex-wrap: wrap;">
                                <label class="upload-btn">
                                    <span>📁</span>
                                    <span>选择音频文件</span>
                                    <input type="file" name="audio" id="audio-input" accept="audio/*">
                                </label>
                                <button type="button" class="record-btn" id="record-btn" onclick="toggleRecording()">
                                    <span>🎙️</span>
                                    <span id="record-text">开始录音</span>
                                </button>
                                <small style="color: var(--text-muted); width: 100%;">支持 MP3、WAV、OGG、M4A 格式，或直接录音</small>
                            </div>
                            <div class="audio-preview" id="audio-preview" style="display: none;">
                                <span>🎵</span>
                                <audio id="audio-player" controls></audio>
                                <button type="button" class="remove-btn" onclick="removeAudio()">删除</button>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">标签（可选，用逗号分隔）</label>
                        <input type="text" name="tags" class="form-control" placeholder="例如：技术, 讨论, 问答">
                    </div>

                    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                        <button type="submit" class="btn btn-primary">发布帖子</button>
                        <a href="{{ url_for('main.index') }}" class="btn btn-ghost">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const editor = document.getElementById('content-editor');
const preview = document.getElementById('content-preview');
const container = document.querySelector('.md-editor-container');

// 图片上传相关
const imageInput = document.getElementById('image-input');
const imagePreview = document.getElementById('image-preview');
let selectedImages = [];

imageInput.addEventListener('change', function(e) {
    const files = Array.from(e.target.files);
    
    // 限制最多9张图片
    if (selectedImages.length + files.length > 9) {
        Utils.showToast('最多只能上传9张图片', 'warning');
        return;
    }
    
    files.forEach(file => {
        if (file.type.startsWith('image/')) {
            selectedImages.push(file);
            addImagePreview(file, selectedImages.length - 1);
        }
    });
    
    updateImageInput();
});

function addImagePreview(file, index) {
    const reader = new FileReader();
    reader.onload = function(e) {
        const div = document.createElement('div');
        div.className = 'image-preview-item';
        div.dataset.index = index;
        div.innerHTML = `
            <img src="${e.target.result}" alt="预览">
            <button type="button" class="remove-btn" onclick="removeImage(${index})">×</button>
        `;
        imagePreview.appendChild(div);
    };
    reader.readAsDataURL(file);
}

function removeImage(index) {
    selectedImages.splice(index, 1);
    renderImagePreviews();
    updateImageInput();
}

function renderImagePreviews() {
    imagePreview.innerHTML = '';
    selectedImages.forEach((file, index) => {
        addImagePreview(file, index);
    });
}

function updateImageInput() {
    // 创建新的 DataTransfer 对象来更新 input
    const dt = new DataTransfer();
    selectedImages.forEach(file => dt.items.add(file));
    imageInput.files = dt.files;
}

// 语音上传相关
const audioInput = document.getElementById('audio-input');
const audioPreview = document.getElementById('audio-preview');
const audioPlayer = document.getElementById('audio-player');
const recordBtn = document.getElementById('record-btn');
const recordText = document.getElementById('record-text');

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let recordedBlob = null;

audioInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        showAudioPreview(URL.createObjectURL(file));
    }
});

function showAudioPreview(url) {
    audioPlayer.src = url;
    audioPreview.style.display = 'flex';
}

function removeAudio() {
    audioInput.value = '';
    audioPlayer.src = '';
    audioPreview.style.display = 'none';
    recordedBlob = null;
}

async function toggleRecording() {
    if (!isRecording) {
        // 开始录音
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            
            mediaRecorder.ondataavailable = (e) => {
                audioChunks.push(e.data);
            };
            
            mediaRecorder.onstop = () => {
                recordedBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const audioUrl = URL.createObjectURL(recordedBlob);
                showAudioPreview(audioUrl);
                
                // 将录音添加到 input
                const file = new File([recordedBlob], 'recording.webm', { type: 'audio/webm' });
                const dt = new DataTransfer();
                dt.items.add(file);
                audioInput.files = dt.files;
                
                // 停止所有音轨
                stream.getTracks().forEach(track => track.stop());
            };
            
            mediaRecorder.start();
            isRecording = true;
            recordBtn.classList.add('recording');
            recordText.textContent = '停止录音';
        } catch (err) {
            Utils.showToast('无法访问麦克风，请检查权限设置', 'danger');
        }
    } else {
        // 停止录音
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.classList.remove('recording');
        recordText.textContent = '开始录音';
    }
}

// Markdown插入工具
function mdInsert(type) {
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    const selectedText = editor.value.substring(start, end);
    let before = '', after = '', placeholder = '';

    switch (type) {
        case 'bold':
            before = '**'; after = '**';
            placeholder = '粗体文字';
            break;
        case 'italic':
            before = '*'; after = '*';
            placeholder = '斜体文字';
            break;
        case 'strikethrough':
            before = '~~'; after = '~~';
            placeholder = '删除的文字';
            break;
        case 'h2':
            before = '\n## '; after = '\n';
            placeholder = '标题';
            break;
        case 'h3':
            before = '\n### '; after = '\n';
            placeholder = '子标题';
            break;
        case 'quote':
            before = '\n> '; after = '\n';
            placeholder = '引用内容';
            break;
        case 'code':
            before = '`'; after = '`';
            placeholder = '代码';
            break;
        case 'codeblock':
            before = '\n```\n'; after = '\n```\n';
            placeholder = '代码块';
            break;
        case 'ul':
            before = '\n- '; after = '\n';
            placeholder = '列表项';
            break;
        case 'ol':
            before = '\n1. '; after = '\n';
            placeholder = '列表项';
            break;
        case 'task':
            before = '\n- [ ] '; after = '\n';
            placeholder = '待办事项';
            break;
        case 'link':
            before = '['; after = '](url)';
            placeholder = '链接文字';
            break;
        case 'image':
            before = '!['; after = '](图片URL)';
            placeholder = '图片描述';
            break;
        case 'hr':
            before = '\n\n---\n\n'; after = '';
            placeholder = '';
            break;
    }

    const insertText = selectedText || placeholder;
    const newText = before + insertText + after;

    editor.focus();
    document.execCommand('insertText', false, newText);

    // 选中占位符
    if (!selectedText && placeholder) {
        editor.setSelectionRange(start + before.length, start + before.length + placeholder.length);
    }
}

// 预览切换
function togglePreview() {
    container.classList.toggle('preview-mode');

    if (container.classList.contains('preview-mode')) {
        preview.innerHTML = parseMarkdown(editor.value);
    }
}

// 简易Markdown解析器
function parseMarkdown(text) {
    if (!text) return '<p class="text-muted">预览区域（内容为空）</p>';

    let html = text
        // 转义HTML
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        // 代码块
        .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
        // 行内代码
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        // 标题
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        // 粗体斜体
        .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/~~(.+?)~~/g, '<del>$1</del>')
        // 引用
        .replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>')
        // 分隔线
        .replace(/^---$/gm, '<hr>')
        // 链接
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
        // 图片
        .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">')
        // 任务列表
        .replace(/^- \[x\] (.+)$/gm, '<div>☑ $1</div>')
        .replace(/^- \[ \] (.+)$/gm, '<div>☐ $1</div>')
        // 列表
        .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        // 段落
        .replace(/\n\n/g, '</p><p>')
        .replace(/\n/g, '<br>');

    return '<p>' + html + '</p>';
}

// 快捷键支持
editor.addEventListener('keydown', function(e) {
    if (e.ctrlKey || e.metaKey) {
        switch (e.key.toLowerCase()) {
            case 'b':
                e.preventDefault();
                mdInsert('bold');
                break;
            case 'i':
                e.preventDefault();
                mdInsert('italic');
                break;
            case 'k':
                e.preventDefault();
                mdInsert('link');
                break;
        }
    }

    // Tab支持
    if (e.key === 'Tab') {
        e.preventDefault();
        document.execCommand('insertText', false, '    ');
    }
});
</script>
{% endblock %}
